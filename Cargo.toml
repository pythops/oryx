[workspace]
resolver = "2"
members = ["xtask", "oryx-tui", "oryx-common"]

[workspace.package]
description = "TUI for sniffing network traffic using eBPF"
authors = ["Badr Badri <contact@pythops.com>"]
version = "0.8.0"
license = "GPL-3.0"
edition = "2024"
repository = "https://github.com/pythops/oryx"

[workspace.dependencies]
network-types = { version = "0.2", default-features = false }

[profile.release]
opt-level = 3
debug = false
lto = 'fat'
panic = 'abort'
codegen-units = 1
rpath = false
